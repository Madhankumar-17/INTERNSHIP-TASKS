<!DOCTYPE html>
<html>
<head>
    <title>Prediction History</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
            padding:30px;
        }
        h2{
            text-align:center;
        }
        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }
        th,td{
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
        }
        th{
            background:#007bff;
            color:white;
        }
        a{
            display:inline-block;
            margin-bottom:20px;
            text-decoration:none;
            color:white;
            background:#28a745;
            padding:10px 15px;
            border-radius:5px;
        }
    </style>
</head>
<body>

<a href="/">⬅ Back to Home</a>

<h2>Traffic Prediction History</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Location</th>
        <th>Traffic Volume</th>
        <th>Prediction</th>
        <th>Date & Time</th>

    </tr>

    {% for row in rows %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
